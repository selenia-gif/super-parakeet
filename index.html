<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affichage Dynamique</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Helvetica Neue', Arial, sans-serif; }
        
        .slide {
            display: none;
            width: 100vw;
            height: 100vh;
            border: none;
        }

        /* --- SLIDE 1 : MÉTÉO --- */
        .weather-container {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .weather-city { font-size: 3.5rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        .weather-temp { font-size: 8rem; font-weight: bold; margin: 10px 0; color: #f2ab00; }
        .weather-desc { font-size: 2.5rem; text-transform: capitalize; color: #e0e0e0; }

        /* --- SLIDE 2 : TURF PMU --- */
        .pmu-container {
            background: #003a2b;
            padding: 20px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .pmu-card {
            background: #00281e;
            border: 4px solid #f2ab00;
            border-radius: 16px;
            width: 95%;
            max-width: 1000px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            overflow: hidden;
            color: #fff;
        }
        .pmu-header {
            background: #f2ab00;
            color: #00281e;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }
        .pmu-header h1 { font-size: 2rem; text-transform: uppercase; }
        .quinte-section { padding: 20px; text-align: center; }
        .quinte-title { font-size: 1.4rem; color: #f2ab00; margin-bottom: 15px; text-transform: uppercase; font-weight: bold; }
        .numbers-container { display: flex; justify-content: center; gap: 12px; }
        .num-ball {
            background: #ffffff;
            color: #00281e;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            border: 3px solid #f2ab00;
        }
        .num-ball.base { background: #f2ab00; color: #00281e; }
        .turf-iframe {
            width: 100%;
            height: 250px;
            border: none;
            background: #fff;
            border-radius: 10px;
            margin-top: 15px;
        }

        /* --- SLIDE 3 : HORLOGE --- */
        .clock-container {
            background: #111;
            color: #fff;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .clock-time {
            font-size: 8rem;
            font-weight: bold;
            color: #f2ab00;
            font-family: 'Courier New', Courier, monospace;
        }
        .clock-date { font-size: 2.2rem; margin-top: 15px; color: #ccc; text-transform: capitalize; }
    </style>
</head>
<body>

    <!-- SLIDE 1 : MÉTÉO -->
    <div id="slide1" class="slide weather-container" style="display: flex;">
        <div class="weather-city">Saint-Priest</div>
        <div class="weather-temp" id="temp">20°C</div>
        <div class="weather-desc">Météo en direct</div>
    </div>

    <!-- SLIDE 2 : TURF PMU -->
    <div id="slide2" class="slide pmu-container">
        <div class="pmu-card">
            <div class="pmu-header">
                <h1>Espace Turf — Pronostics</h1>
            </div>
            <div class="quinte-section">
                <div class="quinte-title">Sélection du Quinté+</div>
                <div class="numbers-container">
                    <div class="num-ball base">8</div>
                    <div class="num-ball base">3</div>
                    <div class="num-ball">12</div>
                    <div class="num-ball">5</div>
                    <div class="num-ball">1</div>
                </div>
                <iframe class="turf-iframe" srcdoc="<style>body{margin:0;display:flex;justify-content:center;align-items:center;height:100vh;}</style><script type='text/javascript' src='https://www.zone-turf.fr/webmaster/module.js'></script>"></iframe>
            </div>
        </div>
    </div>

    <!-- SLIDE 3 : HORLOGE -->
    <div id="slide3" class="slide clock-container">
        <div class="clock-time" id="timeDisplay">00:00:00</div>
        <div class="clock-date" id="dateDisplay">---</div>
    </div>

    <script>
        // Météo API
        fetch('https://api.open-meteo.com/v1/forecast?latitude=45.696&longitude=4.945&current_weather=true')
            .then(r => r.json())
            .then(d => { if (d && d.current_weather) document.getElementById('temp').textContent = Math.round(d.current_weather.temperature) + '°C'; })
            .catch(() => {});

        // Horloge
        function updateClock() {
            const now = new Date();
            document.getElementById('timeDisplay').textContent = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('dateDisplay').textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // GESTION DU DÉFILEMENT (15s / 30s / 15s)
        const s1 = document.getElementById('slide1');
        const s2 = document.getElementById('slide2');
        const s3 = document.getElementById('slide3');

        function showSlide2() {
            s1.style.display = 'none';
            s2.style.display = 'flex';
            s3.style.display = 'none';
            setTimeout(showSlide3, 30000); // Reste 30s sur le Turf
        }

        function showSlide3() {
            s1.style.display = 'none';
            s2.style.display = 'none';
            s3.style.display = 'flex';
            setTimeout(showSlide1, 15000); // Reste 15s sur l'Horloge
        }

        function showSlide1() {
            s1.style.display = 'flex';
            s2.style.display = 'none';
            s3.style.display = 'none';
            setTimeout(showSlide2, 15000); // Reste 15s sur la Météo
        }

        // Démarrage du cycle après 15 secondes
        setTimeout(showSlide2, 15000);
    </script>
</body>
</html>
