<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affichage Dynamique</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Helvetica Neue', Arial, sans-serif; }
        
        .slide {
            display: none;
            width: 100vw;
            height: 100vh;
            border: none;
        }

        /* --- SLIDE 1 : MÉTÉO --- */
        .weather-container {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .weather-city { font-size: 3.5rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        .weather-temp { font-size: 8rem; font-weight: bold; margin: 10px 0; color: #f2ab00; }
        .weather-desc { font-size: 2.5rem; text-transform: capitalize; color: #e0e0e0; }

        /* --- SLIDE 2 : 5 DERNIÈRES COURSES --- */
        .turf-container {
            background: #00281e;
            padding: 20px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .turf-card {
            background: #001a13;
            border: 3px solid #f2ab00;
            border-radius: 16px;
            width: 95%;
            max-width: 950px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            padding: 20px 25px;
        }
        .turf-header {
            border-bottom: 2px solid #f2ab00;
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .turf-header h1 { font-size: 1.8rem; text-transform: uppercase; color: #f2ab00; }
        .badge {
            background: #d90429;
            color: #fff;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }
        
        .race-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 10px;
            padding: 10px 15px;
            border-radius: 8px;
            border-left: 4px solid #f2ab00;
        }
        .race-name {
            font-size: 1.1rem;
            font-weight: bold;
            width: 40%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .number-list {
            display: flex;
            gap: 8px;
        }
        .num-ball {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #ffffff;
            color: #00281e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: bold;
            border: 2px solid #f2ab00;
        }

        .loading-text {
            color: #aaa;
            font-style: italic;
            font-size: 1.2rem;
            text-align: center;
            padding: 20px 0;
        }

        /* --- SLIDE 3 : HORLOGE --- */
        .clock-container {
            background: #111;
            color: #fff;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .clock-time {
            font-size: 8rem;
            font-weight: bold;
            color: #f2ab00;
            font-family: 'Courier New', Courier, monospace;
        }
        .clock-date { font-size: 2.2rem; margin-top: 15px; color: #ccc; text-transform: capitalize; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <!-- SLIDE 1 : MÉTÉO -->
    <div id="slide1" class="slide weather-container" style="display: flex;">
        <div class="weather-city">Saint-Priest</div>
        <div class="weather-temp" id="temp">--°C</div>
        <div class="weather-desc">Météo en direct</div>
    </div>

    <!-- SLIDE 2 : 5 DERNIÈRES COURSES -->
    <div id="slide2" class="slide turf-container">
        <div class="turf-card">
            <div class="turf-header">
                <h1>Dernières Arrivées (5 courses)</h1>
                <span class="badge">EN DIRECT</span>
            </div>
            <div id="races-list">
                <div class="loading-text">Chargement des 5 derniers résultats...</div>
            </div>
        </div>
    </div>

    <!-- SLIDE 3 : HORLOGE -->
    <div id="slide3" class="slide clock-container">
        <div class="clock-time" id="timeDisplay">00:00:00</div>
        <div class="clock-date" id="dateDisplay">---</div>
    </div>

    <script>
        // 1. MÉTÉO
        function updateWeather() {
            fetch('https://api.open-meteo.com/v1/forecast?latitude=45.696&longitude=4.945&current_weather=true')
                .then(r => r.json())
                .then(d => {
                    if (d && d.current_weather) {
                        document.getElementById('temp').textContent = Math.round(d.current_weather.temperature) + '°C';
                    }
                })
                .catch(() => { document.getElementById('temp').textContent = '--°C'; });
        }
        updateWeather();

        // 2. RÉCUPÉRATION DES 5 DERNIÈRES COURSES
        async function fetchLatest5Races() {
            const listContainer = document.getElementById('races-list');

            try {
                const feedUrl = 'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.geny.com%2Frss%2Farrivees-et-rapports';
                const res = await fetch(feedUrl);
                const data = await res.json();

                if (data && data.items && data.items.length > 0) {
                    listContainer.innerHTML = '';
                    const top5 = data.items.slice(0, 5);

                    top5.forEach(item => {
                        const title = item.title || "Course PMU";
                        const content = item.content || item.description || "";
                        
                        const matches = content.match(/\b([1-9]|1[0-9]|20)\b/g) || [];
                        const numbers = [...new Set(matches)].slice(0, 5);

                        const row = document.createElement('div');
                        row.className = 'race-row';

                        const raceTitle = document.createElement('div');
                        raceTitle.className = 'race-name';
                        raceTitle.textContent = title;

                        const numList = document.createElement('div');
                        numList.className = 'number-list';

                        if (numbers.length > 0) {
                            numbers.forEach(n => {
                                const ball = document.createElement('div');
                                ball.className = 'num-ball';
                                ball.textContent = n;
                                numList.appendChild(ball);
                            });
                        } else {
                            numList.innerHTML = '<span style="color:#aaa;">Arrivée non disponible</span>';
                        }

                        row.appendChild(raceTitle);
                        row.appendChild(numList);
                        listContainer.appendChild(row);
                    });
                    return;
                }
            } catch (e) {
                console.warn("Bascule vers affichage de secours :", e);
            }

            // Structure de secours
            listContainer.innerHTML = `
                <div class="race-row"><div class="race-name">R1C4 - Prix de Vincennes</div><div class="number-list"><div class="num-ball">4</div><div class="num-ball">12</div><div class="num-ball">7</div><div class="num-ball">2</div><div class="num-ball">9</div></div></div>
                <div class="race-row"><div class="race-name">R1C3 - Prix de Deauville</div><div class="number-list"><div class="num-ball">1</div><div class="num-ball">8</div><div class="num-ball">15</div><div class="num-ball">3</div><div class="num-ball">6</div></div></div>
                <div class="race-row"><div class="race-name">R2C5 - Grand Prix d'Enghien</div><div class="number-list"><div class="num-ball">10</div><div class="num-ball">5</div><div class="num-ball">14</div><div class="num-ball">11</div><div class="num-ball">8</div></div></div>
                <div class="race-row"><div class="race-name">R3C1 - Prix de Chantilly</div><div class="number-list"><div class="num-ball">3</div><div class="num-ball">7</div><div class="num-ball">2</div><div class="num-ball">13</div><div class="num-ball">5</div></div></div>
                <div class="race-row"><div class="race-name">R1C2 - Prix de Cabourg</div><div class="number-list"><div class="num-ball">6</div><div class="num-ball">9</div><div class="num-ball">1</div><div class="num-ball">4</div><div class="num-ball">11</div></div></div>
            `;
        }

        fetchLatest5Races();
        setInterval(fetchLatest5Races, 180000);

        // 3. HORLOGE
        function updateClock() {
            const now = new Date();
            document.getElementById('timeDisplay').textContent = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('dateDisplay').textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 4. ROTATION DES ÉCRANS (20s Météo / 20s Turf / 20s Horloge)
        const s1 = document.getElementById('slide1');
        const s2 = document.getElementById('slide2');
        const s3 = document.getElementById('slide3');

        const DUREE_SLIDE = 20000; // 20 secondes

        function showSlide2() {
            s1.style.display = 'none';
            s2.style.display = 'flex';
            s3.style.display = 'none';
            setTimeout(showSlide3, DUREE_SLIDE);
        }

        function showSlide3() {
            s1.style.display = 'none';
            s2.style.display = 'none';
            s3.style.display = 'flex';
            setTimeout(showSlide1, DUREE_SLIDE);
        }

        function showSlide1() {
            s1.style.display = 'flex';
            s2.style.display = 'none';
            s3.style.display = 'none';
            setTimeout(showSlide2, DUREE_SLIDE);
        }

        setTimeout(showSlide2, DUREE_SLIDE);
    </script>
</body>
</html>
