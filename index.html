<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affichage Dynamique</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Helvetica Neue', Arial, sans-serif; }
        
        .slide {
            display: none;
            width: 100vw;
            height: 100vh;
            border: none;
        }

        /* --- SLIDE 1 : MÉTÉO --- */
        .weather-container {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .weather-city { font-size: 3.5rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        .weather-temp { font-size: 8rem; font-weight: bold; margin: 10px 0; color: #f2ab00; }
        .weather-desc { font-size: 2.5rem; text-transform: capitalize; color: #e0e0e0; }

        /* --- SLIDE 2 : TURF PMU --- */
        .pmu-container {
            background: #003a2b;
            padding: 20px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .pmu-card {
            background: #00281e;
            border: 4px solid #f2ab00;
            border-radius: 16px;
            width: 95%;
            max-width: 1000px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            overflow: hidden;
            color: #fff;
        }
        .pmu-header {
            background: #f2ab00;
            color: #00281e;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }
        .pmu-header h1 { font-size: 2rem; text-transform: uppercase; }
        .live-tag {
            background: #d90429;
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            animation: blink 1.5s infinite;
        }
        .quinte-section { padding: 30px 20px; text-align: center; }
        .quinte-title { font-size: 1.6rem; color: #f2ab00; margin-bottom: 25px; text-transform: uppercase; font-weight: bold; }
        .numbers-container { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .num-ball {
            background: #ffffff;
            color: #00281e;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: bold;
            border: 4px solid #f2ab00;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .num-ball.base { background: #f2ab00; color: #00281e; }

        /* --- SLIDE 3 : HORLOGE --- */
        .clock-container {
            background: #111;
            color: #fff;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .clock-time {
            font-size: 8rem;
            font-weight: bold;
            color: #f2ab00;
            font-family: 'Courier New', Courier, monospace;
        }
        .clock-date { font-size: 2.2rem; margin-top: 15px; color: #ccc; text-transform: capitalize; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <!-- SLIDE 1 : MÉTÉO -->
    <div id="slide1" class="slide weather-container" style="display: flex;">
        <div class="weather-city">Saint-Priest</div>
        <div class="weather-temp" id="temp">--°C</div>
        <div class="weather-desc">Météo en direct</div>
    </div>

    <!-- SLIDE 2 : TURF PMU -->
    <div id="slide2" class="slide pmu-container">
        <div class="pmu-card">
            <div class="pmu-header">
                <h1>Dernier Résultat PMU</h1>
                <span class="live-tag">EN DIRECT</span>
            </div>
            <div class="quinte-section">
                <div id="course-title" class="quinte-title">Recherche des résultats...</div>
                <div class="numbers-container" id="pmu-results">
                    <!-- Les numéros arrivés s'afficheront ici -->
                </div>
            </div>
        </div>
    </div>

    <!-- SLIDE 3 : HORLOGE -->
    <div id="slide3" class="slide clock-container">
        <div class="clock-time" id="timeDisplay">00:00:00</div>
        <div class="clock-date" id="dateDisplay">---</div>
    </div>

    <script>
        // 1. MÉTÉO API (Open-Meteo)
        function updateWeather() {
            fetch('https://api.open-meteo.com/v1/forecast?latitude=45.696&longitude=4.945&current_weather=true')
                .then(r => r.json())
                .then(d => {
                    if (d && d.current_weather) {
                        document.getElementById('temp').textContent = Math.round(d.current_weather.temperature) + '°C';
                    }
                })
                .catch(() => { document.getElementById('temp').textContent = '--°C'; });
        }
        updateWeather();

        // 2. PMU API (Officiel)
        async function fetchPMUResults() {
            try {
                const today = new Date();
                const day = String(today.getDate()).padStart(2, '0');
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const year = today.getFullYear();
                const dateStr = `${day}${month}${year}`;

                const response = await fetch(`https://online.pmu.fr/rest/client/7/programme/${dateStr}`);
                const data = await response.json();

                if (data && data.reunions) {
                    let lastFinishedCourse = null;

                    for (const reunion of data.reunions) {
                        if (reunion.courses) {
                            for (const course of reunion.courses) {
                                if (course.statut === 'ARRIVEE' && course.ordreArrivee) {
                                    lastFinishedCourse = course;
                                }
                            }
                        }
                    }

                    if (lastFinishedCourse) {
                        document.getElementById('course-title').textContent = 
                            `R${lastFinishedCourse.numReunion}C${lastFinishedCourse.numOrdre} - ${lastFinishedCourse.nom}`;
                        
                        const top5 = lastFinishedCourse.ordreArrivee.slice(0, 5);
                        const container = document.getElementById('pmu-results');
                        container.innerHTML = '';

                        top5.forEach((num, index) => {
                            const ball = document.createElement('div');
                            ball.className = index < 3 ? 'num-ball base' : 'num-ball';
                            ball.textContent = num;
                            container.appendChild(ball);
                        });
                    } else {
                        document.getElementById('course-title').textContent = "En attente des premiers résultats du jour";
                    }
                }
            } catch (error) {
                console.error("Erreur PMU API:", error);
                document.getElementById('course-title').textContent = "Résultats temporairement indisponibles";
            }
        }
        fetchPMUResults();
        setInterval(fetchPMUResults, 180000); // Mise à jour toutes les 3 min

        // 3. HORLOGE
        function updateClock() {
            const now = new Date();
            document.getElementById('timeDisplay').textContent = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('dateDisplay').textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 4. ROTATION DES ÉCRANS (15s Météo / 30s PMU / 15s Horloge)
        const s1 = document.getElementById('slide1');
        const s2 = document.getElementById('slide2');
        const s3 = document.getElementById('slide3');

        function showSlide2() {
            s1.style.display = 'none';
            s2.style.display = 'flex';
            s3.style.display = 'none';
            setTimeout(showSlide3, 30000);
        }

        function showSlide3() {
            s1.style.display = 'none';
            s2.style.display = 'none';
            s3.style.display = 'flex';
            setTimeout(showSlide1, 15000);
        }

        function showSlide1() {
            s1.style.display = 'flex';
            s2.style.display = 'none';
            s3.style.display = 'none';
            setTimeout(showSlide2, 15000);
        }

        setTimeout(showSlide2, 15000);
    </script>
</body>
</html>
