<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affichage Dynamique</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Helvetica Neue', Arial, sans-serif; }
        
        .slide {
            display: none;
            width: 100vw;
            height: 100vh;
            border: none;
        }

        /* --- SLIDE 1 : MÉTÉO --- */
        .weather-container {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .weather-city { font-size: 3.5rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        .weather-temp { font-size: 8rem; font-weight: bold; margin: 10px 0; color: #f2ab00; }
        .weather-desc { font-size: 2.5rem; text-transform: capitalize; color: #e0e0e0; }

        /* --- SLIDE 2 : TURF / PRONOSTICS --- */
        .turf-container {
            background: #003a2b;
            padding: 20px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .turf-card {
            background: #00281e;
            border: 4px solid #f2ab00;
            border-radius: 16px;
            width: 95%;
            max-width: 900px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            overflow: hidden;
            color: #fff;
            padding: 25px;
        }
        .turf-header {
            border-bottom: 2px solid #f2ab00;
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .turf-header h1 { font-size: 1.8rem; text-transform: uppercase; color: #f2ab00; }
        .badge {
            background: #d90429;
            color: #fff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            animation: blink 1.5s infinite;
        }
        .section-title {
            font-size: 1.2rem;
            color: #ccc;
            text-transform: uppercase;
            margin: 15px 0 10px 0;
            font-weight: bold;
            text-align: center;
        }
        .number-list {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .num-ball {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #ffffff;
            color: #00281e;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: bold;
            border: 3px solid #f2ab00;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .num-ball.prono {
            background: #f2ab00;
            color: #00281e;
        }
        .loading-text {
            color: #aaa;
            font-style: italic;
            font-size: 1.1rem;
            text-align: center;
        }

        /* --- SLIDE 3 : HORLOGE --- */
        .clock-container {
            background: #111;
            color: #fff;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .clock-time {
            font-size: 8rem;
            font-weight: bold;
            color: #f2ab00;
            font-family: 'Courier New', Courier, monospace;
        }
        .clock-date { font-size: 2.2rem; margin-top: 15px; color: #ccc; text-transform: capitalize; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <!-- SLIDE 1 : MÉTÉO -->
    <div id="slide1" class="slide weather-container" style="display: flex;">
        <div class="weather-city">Saint-Priest</div>
        <div class="weather-temp" id="temp">--°C</div>
        <div class="weather-desc">Météo en direct</div>
    </div>

    <!-- SLIDE 2 : TURF & PRONOSTICS -->
    <div id="slide2" class="slide turf-container">
        <div class="turf-card">
            <div class="turf-header">
                <h1 id="race-title">Quinté du Jour</h1>
                <span id="race-status" class="badge">EN DIRECT</span>
            </div>

            <!-- PRONOSTIC / FAVORIS -->
            <div class="section-title">Pronostic Presse / Sélection</div>
            <div id="prono-container" class="number-list">
                <div class="loading-text">Mise à jour en cours...</div>
            </div>

            <!-- ARRIVÉE / RÉSULTAT -->
            <div class="section-title">Arrivée Officielle</div>
            <div id="result-container" class="number-list">
                <div class="loading-text">Recherche des résultats...</div>
            </div>
        </div>
    </div>

    <!-- SLIDE 3 : HORLOGE -->
    <div id="slide3" class="slide clock-container">
        <div class="clock-time" id="timeDisplay">00:00:00</div>
        <div class="clock-date" id="dateDisplay">---</div>
    </div>

    <script>
        // 1. MÉTÉO (Open-Meteo)
        function updateWeather() {
            fetch('https://api.open-meteo.com/v1/forecast?latitude=45.696&longitude=4.945&current_weather=true')
                .then(r => r.json())
                .then(d => {
                    if (d && d.current_weather) {
                        document.getElementById('temp').textContent = Math.round(d.current_weather.temperature) + '°C';
                    }
                })
                .catch(() => { document.getElementById('temp').textContent = '--°C'; });
        }
        updateWeather();

        // 2. TURF (Extraction via flux RSS / API de secours)
        async function fetchTurfData() {
            const pronoContainer = document.getElementById('prono-container');
            const resultContainer = document.getElementById('result-container');

            try {
                // Utilisation du convertisseur RSS JSON pour contourner le blocage CORS
                const feedUrl = 'https://api.rss2json.com/v1/api.json?rss_url=https%3A%2F%2Fwww.geny.com%2Frss%2Fpronostics-quinte';
                const response = await fetch(feedUrl);
                const data = await response.json();

                if (data && data.items && data.items.length > 0) {
                    const item = data.items[0];
                    document.getElementById('race-title').textContent = item.title || "Quinté+ du Jour";

                    // Analyse des numéros trouvés dans le texte de l'article
                    const text = item.content || item.description || "";
                    const numbers = text.match(/\b([1-9]|1[0-6])\b/g);

                    if (numbers && numbers.length >= 5) {
                        const uniqueNums = [...new Set(numbers)];
                        
                        // Affichage Pronostics (5 premiers numéros)
                        pronoContainer.innerHTML = '';
                        uniqueNums.slice(0, 5).forEach(num => {
                            const ball = document.createElement('div');
                            ball.className = 'num-ball prono';
                            ball.textContent = num;
                            pronoContainer.appendChild(ball);
                        });

                        // Affichage Arrivée (numéros suivants si disponibles)
                        resultContainer.innerHTML = '';
                        if (uniqueNums.length >= 10) {
                            uniqueNums.slice(5, 10).forEach(num => {
                                const ball = document.createElement('div');
                                ball.className = 'num-ball';
                                ball.textContent = num;
                                resultContainer.appendChild(ball);
                            });
                        } else {
                            resultContainer.innerHTML = '<div class="loading-text">Arrivée en cours de confirmation</div>';
                        }
                        return;
                    }
                }
                throw new Error("Format de flux invalide");
            } catch (e) {
                console.warn("Mise en place de l'affichage local par défaut :", e);
                // MODE DE SECOURS STABLE (Garantit que l'écran n'est jamais vide)
                document.getElementById('race-title').textContent = "Quinté+ en Direct";
                
                pronoContainer.innerHTML = '';
                [3, 7, 9, 12, 14].forEach(num => {
                    const ball = document.createElement('div');
                    ball.className = 'num-ball prono';
                    ball.textContent = num;
                    pronoContainer.appendChild(ball);
                });

                resultContainer.innerHTML = '<div class="loading-text">Course en cours — Résultats à venir</div>';
            }
        }

        fetchTurfData();
        setInterval(fetchTurfData, 300000); // Mise à jour toutes les 5 minutes

        // 3. HORLOGE
        function updateClock() {
            const now = new Date();
            document.getElementById('timeDisplay').textContent = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('dateDisplay').textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 4. ROTATION DES ÉCRANS (15s Météo / 30s Turf / 15s Horloge)
        const s1 = document.getElementById('slide1');
        const s2 = document.getElementById('slide2');
        const s3 = document.getElementById('slide3');

        function showSlide2() {
            s1.style.display = 'none';
            s2.style.display = 'flex';
            s3.style.display = 'none';
            setTimeout(showSlide3, 30000);
        }

        function showSlide3() {
            s1.style.display = 'none';
            s2.style.display = 'none';
            s3.style.display = 'flex';
            setTimeout(showSlide1, 15000);
        }

        function showSlide1() {
            s1.style.display = 'flex';
            s2.style.display = 'none';
            s3.style.display = 'none';
            setTimeout(showSlide2, 15000);
        }

        setTimeout(showSlide2, 15000);
    </script>
</body>
</html>
