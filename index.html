<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affichage Dynamique</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Helvetica Neue', Arial, sans-serif; }
        
        .slide {
            display: none;
            width: 100vw;
            height: 100vh;
            border: none;
        }

        /* --- SLIDE 1 : MÉTÉO --- */
        .weather-container {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .weather-city { font-size: 3.5rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        .weather-temp { font-size: 8rem; font-weight: bold; margin: 10px 0; color: #f2ab00; }
        .weather-desc { font-size: 2.5rem; text-transform: capitalize; color: #e0e0e0; }

        /* --- SLIDE 2 : GENYBET --- */
        .pmu-container {
            background: #111;
            width: 100vw;
            height: 100vh;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }
        .geny-header {
            background: #d90429;
            color: #fff;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .geny-header h1 { font-size: 2rem; text-transform: uppercase; }
        .live-tag {
            background: #fff;
            color: #d90429;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.9rem;
            animation: blink 1.5s infinite;
        }
        .geny-iframe {
            width: 100%;
            height: calc(100vh - 65px);
            border: none;
            background: #fff;
        }

        /* --- SLIDE 3 : HORLOGE --- */
        .clock-container {
            background: #111;
            color: #fff;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .clock-time {
            font-size: 8rem;
            font-weight: bold;
            color: #f2ab00;
            font-family: 'Courier New', Courier, monospace;
        }
        .clock-date { font-size: 2.2rem; margin-top: 15px; color: #ccc; text-transform: capitalize; }

        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <!-- SLIDE 1 : MÉTÉO -->
    <div id="slide1" class="slide weather-container" style="display: flex;">
        <div class="weather-city">Saint-Priest</div>
        <div class="weather-temp" id="temp">--°C</div>
        <div class="weather-desc">Météo en direct</div>
    </div>

    <!-- SLIDE 2 : GENYBET -->
    <div id="slide2" class="slide pmu-container">
        <div class="geny-header">
            <h1>Genybet Turf — Courses & Pronostics</h1>
            <span class="live-tag">EN DIRECT</span>
        </div>
        <!-- Intégration de Genybet Turf -->
        <iframe class="geny-iframe" src="https://m.genybet.fr/turf"></iframe>
    </div>

    <!-- SLIDE 3 : HORLOGE -->
    <div id="slide3" class="slide clock-container">
        <div class="clock-time" id="timeDisplay">00:00:00</div>
        <div class="clock-date" id="dateDisplay">---</div>
    </div>

    <script>
        // 1. MÉTÉO
        function updateWeather() {
            fetch('https://api.open-meteo.com/v1/forecast?latitude=45.696&longitude=4.945&current_weather=true')
                .then(r => r.json())
                .then(d => {
                    if (d && d.current_weather) {
                        document.getElementById('temp').textContent = Math.round(d.current_weather.temperature) + '°C';
                    }
                })
                .catch(() => { document.getElementById('temp').textContent = '--°C'; });
        }
        updateWeather();

        // 2. HORLOGE
        function updateClock() {
            const now = new Date();
            document.getElementById('timeDisplay').textContent = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('dateDisplay').textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 3. ROTATION DES ÉCRANS (15s Météo / 30s Genybet / 15s Horloge)
        const s1 = document.getElementById('slide1');
        const s2 = document.getElementById('slide2');
        const s3 = document.getElementById('slide3');

        function showSlide2() {
            s1.style.display = 'none';
            s2.style.display = 'flex';
            s3.style.display = 'none';
            setTimeout(showSlide3, 30000); // 30 secondes sur Genybet
        }

        function showSlide3() {
            s1.style.display = 'none';
            s2.style.display = 'none';
            s3.style.display = 'flex';
            setTimeout(showSlide1, 15000); // 15 secondes sur l'Horloge
        }

        function showSlide1() {
            s1.style.display = 'flex';
            s2.style.display = 'none';
            s3.style.display = 'none';
            setTimeout(showSlide2, 15000); // 15 secondes sur la Météo
        }

        setTimeout(showSlide2, 15000);
    </script>
</body>
</html>
