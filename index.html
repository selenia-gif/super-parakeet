<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Affichage Dynamique</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        .slide {
            display: none;
            width: 100vw;
            height: 100vh;
            border: none;
        }

        /* --- SLIDE 1 : MÉTÉO --- */
        .weather-container {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: #fff;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .weather-city { font-size: 2.8rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        
        .weather-current { 
            display: flex; 
            align-items: center; 
            justify-content: center;
            gap: 20px; 
            margin: 10px 0 25px 0; 
        }
        .weather-current-icon { font-size: 5rem; line-height: 1; }
        .weather-temp { font-size: 6rem; font-weight: bold; color: #f2ab00; line-height: 1; }
        .weather-desc { font-size: 1.8rem; text-transform: capitalize; color: #e0e0e0; text-align: left; }

        .forecast-grid {
            display: flex;
            gap: 12px;
            width: 95%;
            max-width: 920px;
            justify-content: center;
        }
        .forecast-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border-radius: 14px;
            padding: 12px 6px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .forecast-day { font-size: 1rem; font-weight: bold; text-transform: capitalize; color: #f2ab00; margin-bottom: 4px; }
        .forecast-icon { font-size: 2rem; margin: 4px 0; }
        .forecast-temps { font-size: 0.95rem; font-weight: 600; display: flex; flex-direction: column; gap: 2px; }
        .temp-max { color: #ffffff; }
        .temp-min { color: #a0aec0; }

        /* --- SLIDE 2 : HIPPIQUE --- */
        .turf-container {
            background: #ffffff;
            width: 100vw;
            height: 100vh;
        }
        .turf-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- SLIDE 3 : HORLOGE --- */
        .clock-container {
            background: #111;
            color: #fff;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .clock-time {
            font-size: 8rem;
            font-weight: bold;
            color: #f2ab00;
            font-family: 'Courier New', Courier, monospace;
        }
        .clock-date { font-size: 2.2rem; margin-top: 15px; color: #ccc; text-transform: capitalize; }
    </style>
</head>
<body>

    <!-- SLIDE 1 : MÉTÉO -->
    <div id="slide1" class="slide weather-container" style="display: flex;">
        <div class="weather-city">Saint-Priest</div>
        <div class="weather-current">
            <div class="weather-current-icon" id="currentIcon">☀️</div>
            <div class="weather-temp" id="temp">--°C</div>
            <div class="weather-desc">Météo en direct<br><span style="font-size: 1.2rem; color: #f2ab00;">Prévisions 7 jours</span></div>
        </div>
        <div class="forecast-grid" id="forecastGrid">
            <div style="color: #ccc;">Chargement des prévisions...</div>
        </div>
    </div>

    <!-- SLIDE 2 : COURSES HIPPIQUES -->
    <div id="slide2" class="slide turf-container">
        <iframe class="turf-iframe" src="https://m.mecanique-turf.com/arrivees.php"></iframe>
    </div>

    <!-- SLIDE 3 : HORLOGE -->
    <div id="slide3" class="slide clock-container">
        <div class="clock-time" id="timeDisplay">00:00:00</div>
        <div class="clock-date" id="dateDisplay">---</div>
    </div>

    <script>
        // --- 1. MÉTÉO ---
        function getWeatherIcon(code) {
            if (code === 0) return '☀️';
            if (code === 1 || code === 2) return '🌤️';
            if (code === 3) return '☁️';
            if (code >= 45 && code <= 48) return '🌫️';
            if (code >= 51 && code <= 67) return '🌧️';
            if (code >= 71 && code <= 77) return '❄️';
            if (code >= 80 && code <= 82) return '🌦️';
            if (code >= 85 && code <= 86) return '🌨️';
            if (code >= 95 && code <= 99) return '⛈️';
            return '☀️';
        }

        function updateWeather() {
            const url = 'https://api.open-meteo.com/v1/forecast?latitude=45.696&longitude=4.945&current_weather=true&daily=weathercode,temperature_2m_max,temperature_2m_min&timezone=Europe%2FParis';
            
            fetch(url)
                .then(r => r.json())
                .then(d => {
                    if (d && d.current_weather) {
                        document.getElementById('temp').textContent = Math.round(d.current_weather.temperature) + '°C';
                        document.getElementById('currentIcon').textContent = getWeatherIcon(d.current_weather.weathercode);
                    }

                    if (d && d.daily && d.daily.time) {
                        const grid = document.getElementById('forecastGrid');
                        grid.innerHTML = '';
                        const days = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];

                        for (let i = 0; i < 7; i++) {
                            const dateObj = new Date(d.daily.time[i]);
                            const dayName = i === 0 ? 'Auj.' : days[dateObj.getDay()];
                            const maxTemp = Math.round(d.daily.temperature_2m_max[i]);
                            const minTemp = Math.round(d.daily.temperature_2m_min[i]);
                            const icon = getWeatherIcon(d.daily.weathercode[i]);

                            const card = document.createElement('div');
                            card.className = 'forecast-card';
                            card.innerHTML = `
                                <div class="forecast-day">${dayName}</div>
                                <div class="forecast-icon">${icon}</div>
                                <div class="forecast-temps">
                                    <span class="temp-max">${maxTemp}°</span>
                                    <span class="temp-min">${minTemp}°</span>
                                </div>
                            `;
                            grid.appendChild(card);
                        }
                    }
                })
                .catch(() => { document.getElementById('temp').textContent = '--°C'; });
        }
        updateWeather();

        // --- 2. HORLOGE ---
        function updateClock() {
            const now = new Date();
            document.getElementById('timeDisplay').textContent = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('dateDisplay').textContent = now.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- 3. ROTATION DES ÉCRANS (20s) ---
        const s1 = document.getElementById('slide1');
        const s2 = document.getElementById('slide2');
        const s3 = document.getElementById('slide3');
        const DUREE_SLIDE = 20000;

        function showSlide2() {
            s1.style.display = 'none';
            s2.style.display = 'flex';
            s3.style.display = 'none';
            setTimeout(showSlide3, DUREE_SLIDE);
        }

        function showSlide3() {
            s1.style.display = 'none';
            s2.style.display = 'none';
            s3.style.display = 'flex';
            setTimeout(showSlide1, DUREE_SLIDE);
        }

        function showSlide1() {
            s1.style.display = 'flex';
            s2.style.display = 'none';
            s3.style.display = 'none';
            setTimeout(showSlide2, DUREE_SLIDE);
        }

        setTimeout(showSlide2, DUREE_SLIDE);
    </script>
</body>
</html>
