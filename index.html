<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Affichage Magasin</title>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    iframe { width: 100vw; height: 100vh; border: none; }
  </style>
</head>
<body>

  <iframe id="displayFrame" src=""></iframe>

  <script>
    // 1. Liste de vos liens et leur durée d'affichage en secondes
    const pages = [
      { url: "https://www.equidia.fr/courses", duration: 30 },    // Equidia
      { url: "https://www.meteocity.com/", duration: 15 } // Météo (à remplacer par votre ville)
    ];

    let currentIndex = 0;
    const frame = document.getElementById('displayFrame');

    function loadNextPage() {
      const currentPage = pages[currentIndex];
      frame.src = currentPage.url;
      
      // Calcule le temps pour la page suivante
      setTimeout(() => {
        currentIndex = (currentIndex + 1) % pages.length;
        loadNextPage();
      }, currentPage.duration * 1000);
    }

    // Démarrage de la boucle
    loadNextPage();
  </script>

</body>
</html>
